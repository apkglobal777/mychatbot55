<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Chatbot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 400px;
            max-width: 95%;
            height: 600px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h2 {
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f5f5f5;
        }

        .message {
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.4;
        }

        .bot {
            background: #e5e7eb;
            color: #222;
            margin-right: auto;
            border-bottom-left-radius: 3px;
        }

        .user {
            background: #4f46e5;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 3px;
        }

        .input-area {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
        }

        #userInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        #sendBtn {
            margin-left: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        #sendBtn:hover {
            background: #3730a3;
        }

        @media (max-width: 500px) {
            .chat-container {
                height: 95vh;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h2>🤖 My Chatbot</h2>
            <p>Ask me anything!</p>
        </div>

        <div class="chat-box" id="chatBox">

            <div class="message bot">
                👋 Hello! I am your chatbot. How can I help you?
            </div>

        </div>

        <div class="input-area">
            <input
                type="text"
                id="userInput"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button id="sendBtn">Send</button>
        </div>

    </div>


    <script>

        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");


        function addMessage(message, sender) {

            const div = document.createElement("div");

            div.classList.add("message", sender);

            div.textContent = message;

            chatBox.appendChild(div);

            chatBox.scrollTop = chatBox.scrollHeight;
        }


        function getBotResponse(message) {

            message = message.toLowerCase();

            if (message.includes("hello") ||
                message.includes("hi") ||
                message.includes("hey")) {

                return "Hello! 👋 Nice to meet you!";
            }

            if (message.includes("name")) {

                return "My name is My Chatbot 🤖";
            }

            if (message.includes("how are you")) {

                return "I am doing great! 😊 How are you?";
            }

            if (message.includes("python")) {

                return "Python is a popular programming language used for AI, Data Science, Web Development and Automation. 🐍";
            }

            if (message.includes("html")) {

                return "HTML is used to create the structure of webpages. 🌐";
            }

            if (message.includes("css")) {

                return "CSS is used to design and style webpages. 🎨";
            }

            if (message.includes("javascript") ||
                message.includes("js")) {

                return "JavaScript makes websites interactive and dynamic. ⚡";
            }

            if (message.includes("github")) {

                return "GitHub is a platform for storing and sharing code. You can also host websites using GitHub Pages. 🚀";
            }

            if (message.includes("thank")) {

                return "You're welcome! 😊";
            }

            if (message.includes("bye")) {

                return "Goodbye! 👋 Have a great day!";
            }

            return "Sorry, I don't understand that yet. 🤔 Try asking about HTML, CSS, JavaScript, Python or GitHub.";
        }


        function sendMessage() {

            const message = userInput.value.trim();

            if (message === "") {
                return;
            }

            // Show user message
            addMessage(message, "user");

            // Clear input
            userInput.value = "";

            // Bot typing delay
            setTimeout(function() {

                const response = getBotResponse(message);

                addMessage(response, "bot");

            }, 500);
        }


        sendBtn.addEventListener("click", sendMessage);


        userInput.addEventListener("keypress", function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        });

    </script>

</body>
</html>
